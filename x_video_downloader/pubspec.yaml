name: x_video_downloader
description: "Batch X.com video downloader"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.1
  gal: ^2.3.0
  http: ^1.2.2
  share_plus: ^12.0.2
  file_selector: ^1.0.3
  file_picker: ^8.1.7
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  path: ^1.9.0
  google_fonts: ^8.0.2
  webview_flutter: ^4.13.1
  webview_flutter_wkwebview: ^3.24.3
  window_size: ^0.1.0
  video_player: ^2.10.0
  intl: ^0.20.2
  html: ^0.15.4
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/transparent.png"

flutter:
  uses-material-design: true
